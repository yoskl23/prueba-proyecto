<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Retiro | EcoRed</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <header>
        <a href="index.html">EcoRed</a>
        <nav aria-label="Navegación del comercio">
            <a href="panel-comercio.html">Mi Panel</a>
            <a href="publicar-oferta.html">Publicar Oferta</a>
            <a href="confirmar-retiro.html">Validar Retiro</a>
            <a href="login.html">Cerrar sesión</a>
        </nav>
    </header>

    <main class="tarjeta-login" style="max-width: 450px; text-align: center;">
        <h1>Validar Entrega (CU-13)</h1>
        <p>Ingresa el código del cliente para confirmar la entrega.</p>
        <p><small style="color: red;">* El código solo puede ser utilizado una vez.</small></p>

        <form action="procesar-retiro.php" method="POST" style="margin-top: 24px;">
            <p>
                <label for="codigo" style="display: block; text-align: left;">Código de reserva:</label>
                <input type="text" id="codigo" name="codigo_retiro" placeholder="ECO-001" 
                       style="text-align: center; font-size: 24px; letter-spacing: 4px; text-transform: uppercase;" 
                       required maxlength="10">
            </p>

            <p style="margin-top: 24px;">
                <button type="submit" style="width: 100%; font-size: 16px; background-color: #244d36; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer;">Confirmar Retiro</button>
            </p>
        </form>
        
        <p style="margin-top: 16px;">
            <a href="panel-comercio.html" style="color: #244d36;">Volver al panel</a>
        </p>
    </main>

    <footer>
        <p>EcoRed . Menos desperdicio, más oportunidades</p>
    </footer>
